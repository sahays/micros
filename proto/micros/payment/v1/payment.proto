syntax = "proto3";

package micros.payment.v1;

import "micros/payment/v1/transaction.proto";
import "micros/payment/v1/linked_account.proto";
import "micros/payment/v1/customer.proto";
import "micros/payment/v1/transfer.proto";
import "micros/payment/v1/settlement.proto";
import "micros/payment/v1/subscription.proto";
import "micros/payment/v1/payment_link.proto";
import "micros/payment/v1/refund.proto";

// PaymentService provides payment operations.
//
// All RPC methods require tenant context in gRPC metadata:
// - x-app-id: Application/tenant ID
// - x-org-id: Organization ID
// - x-user-id: User ID (optional)
service PaymentService {
  // Transaction management

  // Create a new transaction.
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);

  // Get a transaction by ID.
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);

  // Update a transaction's status.
  rpc UpdateTransactionStatus(UpdateTransactionStatusRequest) returns (UpdateTransactionStatusResponse);

  // List transactions with optional filters.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  // Razorpay integration

  // Create a Razorpay order for payment.
  rpc CreateRazorpayOrder(CreateRazorpayOrderRequest) returns (CreateRazorpayOrderResponse);

  // Verify a Razorpay payment after checkout.
  rpc VerifyRazorpayPayment(VerifyRazorpayPaymentRequest) returns (VerifyRazorpayPaymentResponse);

  // UPI integration

  // Generate a UPI QR code for payment.
  rpc GenerateUpiQr(GenerateUpiQrRequest) returns (GenerateUpiQrResponse);

  // Webhook handling (called by BFF to proxy external webhooks)

  // Handle a Razorpay webhook event proxied from BFF.
  rpc HandleRazorpayWebhook(HandleRazorpayWebhookRequest) returns (HandleRazorpayWebhookResponse);

  // Linked account management (Razorpay Route)

  // Create a linked account for marketplace/route payments.
  rpc CreateLinkedAccount(CreateLinkedAccountRequest) returns (CreateLinkedAccountResponse);

  // Get a linked account by ID.
  rpc GetLinkedAccount(GetLinkedAccountRequest) returns (GetLinkedAccountResponse);

  // Update a linked account.
  rpc UpdateLinkedAccount(UpdateLinkedAccountRequest) returns (UpdateLinkedAccountResponse);

  // List linked accounts with optional filters.
  rpc ListLinkedAccounts(ListLinkedAccountsRequest) returns (ListLinkedAccountsResponse);

  // Update commission configuration for a linked account.
  rpc UpdateCommissionConfig(UpdateCommissionConfigRequest) returns (UpdateCommissionConfigResponse);

  // Customer management

  // Create a customer in Razorpay.
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);

  // Get a customer by ID.
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);

  // Update a customer.
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);

  // List customers.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);

  // Transfer management (Razorpay Route)

  // Create a transfer from a payment to a linked account.
  rpc CreateTransferFromPayment(CreateTransferFromPaymentRequest) returns (CreateTransferFromPaymentResponse);

  // Create a transfer with an order.
  rpc CreateTransferFromOrder(CreateTransferFromOrderRequest) returns (CreateTransferFromOrderResponse);

  // Create a direct transfer to a linked account.
  rpc CreateDirectTransfer(CreateDirectTransferRequest) returns (CreateDirectTransferResponse);

  // Reverse a transfer.
  rpc ReverseTransfer(ReverseTransferRequest) returns (ReverseTransferResponse);

  // Get a transfer by ID.
  rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);

  // List transfers with optional filters.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);

  // Hold settlement for a transfer.
  rpc HoldTransferSettlement(HoldTransferSettlementRequest) returns (HoldTransferSettlementResponse);

  // Release settlement for a transfer.
  rpc ReleaseTransferSettlement(ReleaseTransferSettlementRequest) returns (ReleaseTransferSettlementResponse);

  // Settlement management

  // Request an on-demand settlement.
  rpc RequestOnDemandSettlement(RequestOnDemandSettlementRequest) returns (RequestOnDemandSettlementResponse);

  // Get a settlement by ID.
  rpc GetSettlement(GetSettlementRequest) returns (GetSettlementResponse);

  // List settlements with optional filters.
  rpc ListSettlements(ListSettlementsRequest) returns (ListSettlementsResponse);

  // Subscription management

  // Create a subscription plan.
  rpc CreateRazorpayPlan(CreateRazorpayPlanRequest) returns (CreateRazorpayPlanResponse);

  // Get a subscription plan by ID.
  rpc GetRazorpayPlan(GetRazorpayPlanRequest) returns (GetRazorpayPlanResponse);

  // List subscription plans.
  rpc ListRazorpayPlans(ListRazorpayPlansRequest) returns (ListRazorpayPlansResponse);

  // Create a subscription.
  rpc CreateRazorpaySubscription(CreateRazorpaySubscriptionRequest) returns (CreateRazorpaySubscriptionResponse);

  // Get a subscription by ID.
  rpc GetRazorpaySubscription(GetRazorpaySubscriptionRequest) returns (GetRazorpaySubscriptionResponse);

  // List subscriptions with optional filters.
  rpc ListRazorpaySubscriptions(ListRazorpaySubscriptionsRequest) returns (ListRazorpaySubscriptionsResponse);

  // Pause a subscription.
  rpc PauseRazorpaySubscription(PauseRazorpaySubscriptionRequest) returns (PauseRazorpaySubscriptionResponse);

  // Resume a paused subscription.
  rpc ResumeRazorpaySubscription(ResumeRazorpaySubscriptionRequest) returns (ResumeRazorpaySubscriptionResponse);

  // Cancel a subscription.
  rpc CancelRazorpaySubscription(CancelRazorpaySubscriptionRequest) returns (CancelRazorpaySubscriptionResponse);

  // Update a subscription.
  rpc UpdateRazorpaySubscription(UpdateRazorpaySubscriptionRequest) returns (UpdateRazorpaySubscriptionResponse);

  // Payment link management

  // Create a payment link.
  rpc CreatePaymentLink(CreatePaymentLinkRequest) returns (CreatePaymentLinkResponse);

  // Get a payment link by ID.
  rpc GetPaymentLink(GetPaymentLinkRequest) returns (GetPaymentLinkResponse);

  // Cancel a payment link.
  rpc CancelPaymentLink(CancelPaymentLinkRequest) returns (CancelPaymentLinkResponse);

  // List payment links with optional filters.
  rpc ListPaymentLinks(ListPaymentLinksRequest) returns (ListPaymentLinksResponse);

  // Refund management

  // Initiate a refund for a payment.
  rpc InitiateRefund(InitiateRefundRequest) returns (InitiateRefundResponse);

  // Get a refund by ID.
  rpc GetRefund(GetRefundRequest) returns (GetRefundResponse);

  // List refunds with optional filters.
  rpc ListRefunds(ListRefundsRequest) returns (ListRefundsResponse);
}

// CreateRazorpayOrderRequest to create a Razorpay order.
message CreateRazorpayOrderRequest {
  // Amount in smallest currency unit (e.g., paise for INR).
  uint64 amount = 1;

  // Currency code (default: "INR").
  string currency = 2;

  // Optional receipt ID for tracking.
  optional string receipt = 3;

  // Optional notes as JSON string.
  optional string notes_json = 4;
}

// CreateRazorpayOrderResponse after creating a Razorpay order.
message CreateRazorpayOrderResponse {
  // Internal transaction ID.
  string transaction_id = 1;

  // Razorpay order ID (use this in frontend checkout).
  string razorpay_order_id = 2;

  // Amount in smallest currency unit.
  uint64 amount = 3;

  // Currency code.
  string currency = 4;

  // Razorpay key ID (for frontend initialization).
  string razorpay_key_id = 5;
}

// VerifyRazorpayPaymentRequest to verify a payment after checkout.
message VerifyRazorpayPaymentRequest {
  // Internal transaction ID.
  string transaction_id = 1;

  // Razorpay order ID.
  string razorpay_order_id = 2;

  // Razorpay payment ID.
  string razorpay_payment_id = 3;

  // Razorpay signature for verification.
  string razorpay_signature = 4;
}

// VerifyRazorpayPaymentResponse after verifying a payment.
message VerifyRazorpayPaymentResponse {
  // Transaction ID.
  string transaction_id = 1;

  // Updated transaction status.
  TransactionStatus status = 2;

  // Razorpay payment ID.
  string razorpay_payment_id = 3;

  // Human-readable result message.
  string message = 4;
}

// GenerateUpiQrRequest to generate a UPI QR code.
message GenerateUpiQrRequest {
  // Amount in smallest currency unit (e.g., paise for INR).
  uint64 amount_paise = 1;

  // Optional description for the payment.
  optional string description = 2;

  // Optional transaction ID to associate with.
  optional string transaction_id = 3;

  // Optional VPA (Virtual Payment Address).
  optional string vpa = 4;

  // Optional merchant name.
  optional string merchant_name = 5;
}

// GenerateUpiQrResponse with UPI QR code data.
message GenerateUpiQrResponse {
  // UPI payment link.
  string upi_link = 1;

  // Base64-encoded QR code image (optional, may not be generated).
  optional string qr_image_base64 = 2;
}

// HandleRazorpayWebhookRequest contains the raw webhook data from BFF.
message HandleRazorpayWebhookRequest {
  // Raw webhook body (JSON string).
  string body = 1;

  // X-Razorpay-Signature header value for verification.
  string signature = 2;
}

// HandleRazorpayWebhookResponse after processing the webhook.
message HandleRazorpayWebhookResponse {
  // Whether the webhook was processed successfully.
  bool success = 1;

  // Event type that was processed (e.g., "payment.captured").
  string event_type = 2;

  // Optional message with processing details.
  optional string message = 3;
}
