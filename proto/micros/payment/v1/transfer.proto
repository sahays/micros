syntax = "proto3";

package micros.payment.v1;

import "google/protobuf/timestamp.proto";

// TransferStatus represents the lifecycle state of a transfer.
enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  TRANSFER_STATUS_CREATED = 1;
  TRANSFER_STATUS_PENDING = 2;
  TRANSFER_STATUS_PROCESSED = 3;
  TRANSFER_STATUS_REVERSED = 4;
  TRANSFER_STATUS_FAILED = 5;
}

// Transfer represents a Razorpay Route transfer.
message Transfer {
  // Unique identifier.
  string id = 1;

  // Application ID (tenant).
  string app_id = 2;

  // Tenant ID within the application.
  string tenant_id = 3;

  // Razorpay transfer ID.
  string razorpay_transfer_id = 4;

  // Source payment ID (if from payment).
  optional string payment_id = 5;

  // Source order ID (if from order).
  optional string order_id = 6;

  // Destination linked account ID.
  string linked_account_id = 7;

  // Transfer amount in smallest currency unit.
  uint64 amount = 8;

  // Currency code.
  string currency = 9;

  // Current status.
  TransferStatus status = 10;

  // Whether settlement is on hold.
  bool on_hold = 11;

  // Hold until timestamp (optional).
  optional google.protobuf.Timestamp on_hold_until = 12;

  // Commission amount deducted.
  uint64 commission_amount = 13;

  // Amount reversed (if any).
  uint64 amount_reversed = 14;

  // When the transfer was created.
  google.protobuf.Timestamp created_at = 15;

  // When the transfer was last updated.
  google.protobuf.Timestamp updated_at = 16;
}

// CreateTransferFromPaymentRequest to create a transfer from a payment.
message CreateTransferFromPaymentRequest {
  // Payment transaction ID.
  string payment_id = 1;

  // Destination linked account ID.
  string linked_account_id = 2;

  // Transfer amount in smallest currency unit.
  uint64 amount = 3;

  // Currency code.
  string currency = 4;

  // Whether to hold settlement.
  bool on_hold = 5;

  // Hold until timestamp (optional).
  optional google.protobuf.Timestamp on_hold_until = 6;
}

// CreateTransferFromPaymentResponse after creating a transfer.
message CreateTransferFromPaymentResponse {
  // The created transfer.
  Transfer transfer = 1;
}

// CreateTransferFromOrderRequest to create transfers with an order.
message CreateTransferFromOrderRequest {
  // Order ID.
  string order_id = 1;

  // Destination linked account ID.
  string linked_account_id = 2;

  // Transfer amount in smallest currency unit.
  uint64 amount = 3;

  // Currency code.
  string currency = 4;

  // Whether to hold settlement.
  bool on_hold = 5;
}

// CreateTransferFromOrderResponse after creating a transfer.
message CreateTransferFromOrderResponse {
  // The created transfer.
  Transfer transfer = 1;
}

// CreateDirectTransferRequest for a direct (account-to-account) transfer.
message CreateDirectTransferRequest {
  // Destination linked account ID.
  string linked_account_id = 1;

  // Transfer amount in smallest currency unit.
  uint64 amount = 2;

  // Currency code.
  string currency = 3;
}

// CreateDirectTransferResponse after creating a direct transfer.
message CreateDirectTransferResponse {
  // The created transfer.
  Transfer transfer = 1;
}

// ReverseTransferRequest to reverse a transfer.
message ReverseTransferRequest {
  // Transfer ID to reverse.
  string transfer_id = 1;

  // Amount to reverse in smallest currency unit (0 = full reversal).
  uint64 amount = 2;
}

// ReverseTransferResponse after reversing a transfer.
message ReverseTransferResponse {
  // The updated transfer.
  Transfer transfer = 1;
}

// GetTransferRequest to retrieve a transfer by ID.
message GetTransferRequest {
  // Transfer ID.
  string transfer_id = 1;
}

// GetTransferResponse with the transfer details.
message GetTransferResponse {
  // The transfer.
  Transfer transfer = 1;
}

// ListTransfersRequest to list transfers.
message ListTransfersRequest {
  // Filter by linked account ID (optional).
  optional string linked_account_id = 1;

  // Filter by payment ID (optional).
  optional string payment_id = 2;

  // Filter by status (optional).
  optional TransferStatus status = 3;

  // Maximum number of results (default: 50, max: 100).
  int32 limit = 4;

  // Offset for pagination.
  int32 offset = 5;
}

// ListTransfersResponse with paginated transfers.
message ListTransfersResponse {
  // List of transfers.
  repeated Transfer transfers = 1;

  // Total count matching the filter.
  int64 total_count = 2;
}

// HoldTransferSettlementRequest to put a transfer settlement on hold.
message HoldTransferSettlementRequest {
  // Transfer ID.
  string transfer_id = 1;

  // Hold until timestamp (optional).
  optional google.protobuf.Timestamp on_hold_until = 2;
}

// HoldTransferSettlementResponse after holding settlement.
message HoldTransferSettlementResponse {
  // The updated transfer.
  Transfer transfer = 1;
}

// ReleaseTransferSettlementRequest to release a held transfer settlement.
message ReleaseTransferSettlementRequest {
  // Transfer ID.
  string transfer_id = 1;
}

// ReleaseTransferSettlementResponse after releasing settlement.
message ReleaseTransferSettlementResponse {
  // The updated transfer.
  Transfer transfer = 1;
}
