services:
  # Application Stack
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8080}:3000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-auth_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RUST_LOG=${LOG_LEVEL:-info}
      - PORT=3000
      - ENVIRONMENT=dev
      - SERVICE_NAME=auth-service
      - SERVICE_VERSION=${SERVICE_VERSION:-0.1.0}
      - JWT_PRIVATE_KEY_PATH=keys/private.pem
      - JWT_PUBLIC_KEY_PATH=keys/public.pem
      - JWT_ACCESS_TOKEN_EXPIRY_MINUTES=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRY_DAYS=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
      - JWT_APP_TOKEN_EXPIRY_MINUTES=${JWT_APP_TOKEN_EXPIRY_MINUTES:-60}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_SERVICE_ACCOUNT_KEY_PATH=${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-bharatsc-emailsender-key.json}
      - GMAIL_API_SENDER_EMAIL=${GMAIL_API_SENDER_EMAIL:-support@bharatsc.com}
      - GMAIL_API_SENDER_NAME=${GMAIL_API_SENDER_NAME:-BharatSC}
      - GMAIL_API_ENABLED=${GMAIL_API_ENABLED:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - REQUIRE_SIGNATURES=${REQUIRE_SIGNATURES:-false}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-public}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.ImageName}}|{{.Name}}|{{.ID}}"
    volumes:
      - ./auth-service/keys:/app/keys
      - ./${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-bharatsc-emailsender-key.json}:/app/bharatsc-emailsender-key.json:ro
    networks:
      - micros-net

  secure-frontend:
    build:
      context: .
      dockerfile: secure-frontend/Dockerfile
    container_name: secure-frontend
    ports:
      - "${SECURE_FRONTEND_PORT:-8081}:8080"
    environment:
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=8080
      - APP_AUTH_SERVICE__URL=${APP_AUTH_SERVICE__URL:-http://auth-service:3000}
      - APP_AUTH_SERVICE__CLIENT_ID=${APP_AUTH_SERVICE__CLIENT_ID:-secure-frontend}
      - APP_AUTH_SERVICE__SIGNING_SECRET=${APP_AUTH_SERVICE__SIGNING_SECRET}
      - APP_SERVER__SESSION_SECRET=${APP_SERVER__SESSION_SECRET}
      - RUST_LOG=${LOG_LEVEL:-info}
    depends_on:
      - auth-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.ImageName}}|{{.Name}}|{{.ID}}"
    networks:
      - micros-net

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: document-service
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8082}:8080"
    environment:
      - APP__PORT=8080
      - RUST_LOG=${LOG_LEVEL:-info}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.ImageName}}|{{.Name}}|{{.ID}}"
    networks:
      - micros-net

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - micros-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - micros-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  micros-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
