[package]
name = "workflow-tests"
version = "0.1.0"
edition = "2021"
authors = ["Sanjeet Sahay <hello@sanjeets.com>"]
description = "Cross-service workflow integration tests"

[dependencies]
# Service crates (for gRPC client access)
service-core = { path = "../service-core" }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }

# Utilities
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# HTTP client for health checks
reqwest = { workspace = true, features = ["json"] }

# Webhook signature verification (payment tests)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Decimal handling (statement tests)
rust_decimal = "1.36"

# Streaming (document upload tests)
futures = { workspace = true }

[dev-dependencies]
serial_test = "3.0"
tokio-test = "0.4"

[lib]
name = "workflow_tests"
path = "src/lib.rs"
